<rect x="355" y="85" width="290" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="371" y="114" class="head">编辑表格 ITableSource</text>
<text x="371" y="141" class="body">tableRef + columns + name</text>
