<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795" viewBox="0 0 1000 795" role="img" aria-labelledby="title">
<title id="title">跨页连续操作 · 会话可延续，页面字段须重读</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#526581" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#24344b}.title{font-size:23px;font-weight:700}.head{font-size:18px;font-weight:650}.body{font-size:16px}.note{font-size:14px;fill:#526581}</style>
<rect width="1000" height="795" rx="16" fill="#f8fafc"/>
<text x="30" y="43" class="title">跨页连续操作 · 会话可延续，页面字段须重读</text>
<rect x="35" y="80" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="109" class="head">1. 来源页数据进入当前会话</text>
<text x="51" y="136" class="body">通过 initialData 读取并保存快照</text>
<rect x="590" y="80" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="109" class="head">保留的是数据</text>
<text x="606" y="136" class="body">不携带来源页面的可写权限</text>
<path d="M270 176V210" fill="none" stroke="#526581" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="35" y="210" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="239" class="head">2. 查询目录并打开目标页面</text>
<text x="51" y="266" class="body">get_system_pages → open_page</text>
<rect x="590" y="210" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="239" class="head">目录来源</text>
<text x="606" y="266" class="body">权限菜单 + 已接入 manifest</text>
<text x="606" y="289" class="body">真实权限仍由目标系统校验</text>
<path d="M270 306V340" fill="none" stroke="#526581" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="35" y="340" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="369" class="head">3. 写表前等待目标表单就绪</text>
<text x="51" y="396" class="body">waitFor=form；当前上限 15 秒</text>
<rect x="590" y="340" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="369" class="head">就绪条件</text>
<text x="606" y="396" class="body">路由到达、目标唯一且激活</text>
<text x="606" y="419" class="body">字段已初始化；失败则停止</text>
<path d="M270 436V470" fill="none" stroke="#526581" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="35" y="470" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="499" class="head">4. 重新读取目标字段</text>
<text x="51" y="526" class="body">get_current_form_context</text>
<rect x="590" y="470" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="499" class="head">不能沿用</text>
<text x="606" y="526" class="body">来源页面字段 key 或旧草稿</text>
<path d="M270 566V600" fill="none" stroke="#526581" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="35" y="600" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="629" class="head">5. 整理新预览，用户确认</text>
<text x="51" y="656" class="body">prepare_form_fill → 页面写入</text>
<rect x="590" y="600" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="629" class="head">用户操作边界</text>
<text x="606" y="656" class="body">仍由原页面试算、校验和提交</text>
<text x="35" y="771" class="note">这是助手发起的同会话导航；中途切线程或无关页面会中断等待或使原操作失效。</text>
</svg>