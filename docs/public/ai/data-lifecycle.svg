<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="665" viewBox="0 0 1000 665" role="img" aria-labelledby="title">
<title id="title">业务数据解读 · 首句等待数据就绪</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#526581" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#24344b}.title{font-size:23px;font-weight:700}.head{font-size:18px;font-weight:650}.body{font-size:16px}.note{font-size:14px;fill:#526581}</style>
<rect width="1000" height="665" rx="16" fill="#f8fafc"/>
<text x="30" y="43" class="title">业务数据解读 · 首句等待数据就绪</text>
<rect x="35" y="80" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="109" class="head">1. 用户点击解读入口</text>
<text x="51" y="136" class="body">指定当前记录，打开会话</text>
<rect x="590" y="80" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="109" class="head">入口提供</text>
<text x="606" y="136" class="body">initialMessage + initialData</text>
<path d="M270 176V210" fill="none" stroke="#526581" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="35" y="210" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="239" class="head">2. load 读取详情与明细</text>
<text x="51" y="266" class="body">使用原页面接口，返回 JSON 数据</text>
<rect x="590" y="210" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="239" class="head">失败分支</text>
<text x="606" y="266" class="body">提示失败，允许重试</text>
<text x="606" y="289" class="body">不拿列表摘要冒充完整数据</text>
<path d="M270 306V340" fill="none" stroke="#526581" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="35" y="340" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="369" class="head">3. 保存当前会话快照</text>
<text x="51" y="396" class="body">数据就绪，允许自动发送首句</text>
<rect x="590" y="340" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="369" class="head">自动发送条件</text>
<text x="606" y="396" class="body">autoSend=true 且会话就绪</text>
<text x="606" y="419" class="body">用户取消等情况会停止待办</text>
<path d="M270 436V470" fill="none" stroke="#526581" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="35" y="470" width="470" height="96" rx="10" fill="#eff6ff" stroke="#c3d1e3"/>
<text x="51" y="499" class="head">4. L1 调用数据工具并解读</text>
<text x="51" y="526" class="body">get_conversation_data 读取快照</text>
<rect x="590" y="470" width="375" height="96" rx="10" fill="#fff7ed" stroke="#c3d1e3"/>
<text x="606" y="499" class="head">生命周期</text>
<text x="606" y="526" class="body">当前会话持有，不是实时订阅</text>
<text x="606" y="549" class="body">不能保证刷新后恢复快照</text>
<text x="35" y="641" class="note">来源页卸载后，已读取快照仍可用于当前会话；换记录应重新从业务入口读取。</text>
</svg>