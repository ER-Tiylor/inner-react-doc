<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="title">
<title id="title">前端架构：宿主、助手、业务应用与后端的职责和通信关系</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#526581" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#24344b}.title{font-size:23px;font-weight:700}.head{font-size:19px;font-weight:650}.body{font-size:16px}.small{font-size:14px;fill:#526581}.line{fill:none;stroke:#526581;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="800" rx="16" fill="#f8fafc"/>
<text x="32" y="42" class="title">整体架构 · 谁提供能力，谁执行操作</text>
<rect x="24" y="68" width="1052" height="548" rx="14" fill="#eff6ff" stroke="#93b4e9"/>
<text x="45" y="99" class="head">浏览器内 · PASS 宿主与 qiankun 子应用</text>
<rect x="230" y="119" width="640" height="104" rx="12" fill="#ffffff" stroke="#93b4e9" stroke-width="1.5"/>
<text x="250" y="151" class="head">PASS：加载与桥接</text>
<text x="250" y="183" class="body">页面目录 / 导航 / 子应用加载</text>
<text x="250" y="209" class="body">assistantBridge：登记 IFormPort、维护当前 target / 路由 / 会话</text>
<rect x="50" y="300" width="420" height="158" rx="12" fill="#f0fdfa" stroke="#5bb8ac" stroke-width="1.5"/>
<text x="70" y="332" class="head">助手子应用 · feagents</text>
<text x="70" y="364" class="body">CopilotKit 对话、会话、附件、前端工具</text>
<text x="70" y="390" class="body">fill / dropdown：候选匹配、草稿与写入复核</text>
<text x="70" y="416" class="body">Preview：用户核对与确认</text>
<rect x="630" y="300" width="420" height="158" rx="12" fill="#fff7ed" stroke="#e9b773" stroke-width="1.5"/>
<text x="650" y="332" class="head">业务子应用 · BMS / OMS / TMS …</text>
<text x="650" y="364" class="body">assistantBinding：描述本应用控件与字段</text>
<text x="650" y="390" class="body">IFormPort：describe / read / write / 候选</text>
<text x="650" y="416" class="body">原页面：表单、接口请求、业务联动</text>
<path d="M360 223 V280 H260 V300" class="line"/>
<text x="62" y="260" class="small">注入助手客户端与导航能力</text>
<path d="M745 300 V252 H745 V223" class="line"/>
<text x="774" y="260" class="small">登记页面能力</text>
<path d="M470 371 H630" class="line"/>
<text x="486" y="334" class="small">取得活句柄后</text>
<text x="486" y="354" class="small">直接调用页面</text>
<text x="70" y="513" class="body">前端调用：活对象与函数在浏览器内执行，不把函数传给模型。</text>
<text x="70" y="545" class="body">业务范围：候选、认证、租户和联动复用原页面；宿主不代写字段。</text>
<text x="70" y="577" class="body">确认边界：助手只填页面，业务保存仍由原页面完成。</text>
<rect x="50" y="674" width="420" height="100" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="70" y="706" class="head">L1 后端 · Java / Spring Boot / AgentScope</text>
<text x="70" y="738" class="body">模型编排、附件解析、会话；按需调用 L3</text>
<rect x="630" y="674" width="420" height="100" rx="12" fill="#fff7ed" stroke="#e9b773" stroke-width="1.5"/>
<text x="650" y="706" class="head">业务后端</text>
<text x="650" y="738" class="body">原页面接口、权限校验、试算与保存</text>
<path d="M260 458 V478 H35 V660 H260 V674" class="line"/>
<text x="60" y="649" class="small">AG-UI：消息、工具调用与结果</text>
<path d="M840 458 V478 H1060 V660 H840 V674" class="line"/>
<text x="690" y="649" class="small">HTTP：业务页面自己的请求</text>
</svg>