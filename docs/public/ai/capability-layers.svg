<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770" role="img" aria-labelledby="title"><title id="title">原子能力分层 · 页面 API 与模型工具不是同一层</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#526581" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#24344b}.title{font-size:24px;font-weight:700}.head{font-size:19px;font-weight:650}.body{font-size:16px}.note{font-size:14px;fill:#526581}</style><rect width="1100" height="770" rx="16" fill="#f8fafc"/>
<text x="30" y="44" class="title">原子能力分层 · 页面 API 与模型工具不是同一层</text>
<rect x="30" y="82" width="505" height="205" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="48" y="114" class="head">业务页面开发者：组合公开 API</text>
<text x="48" y="146" class="body">注册目标：useAssistantConfig / useAssistantForm</text>
<text x="48" y="173" class="body">开窗与首句：openAssistant / AssistantButton</text>
<text x="48" y="200" class="body">上下文更新：context + notifyAssistant</text>
<text x="48" y="227" class="body">业务数据：initialData.load</text>
<text x="48" y="254" class="body">字段扩展：fields / resolve / apply</text>
<rect x="565" y="82" width="505" height="205" rx="12" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="583" y="114" class="head">L1 / 模型：按任务调用工具</text>
<text x="583" y="146" class="body">读表单：get_current_form_context</text>
<text x="583" y="173" class="body">生成或修订预览：prepare_form_fill</text>
<text x="583" y="200" class="body">读快照：get_conversation_data</text>
<text x="583" y="227" class="body">找页面、跳页面：get_system_pages / open_page</text>
<text x="583" y="254" class="body">展示折线图：renderLineChart（展示组件）</text>
<path d="M280 287V355" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#a)"/>
<text x="75" y="327" class="note">提供目标、规则、数据与可执行能力</text>
<path d="M815 287V355" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#a)"/>
<text x="647" y="327" class="note">发出工具调用，接收结构化结果</text>
<rect x="145" y="355" width="810" height="140" rx="12" fill="#f0fdfa" stroke="#cbd5e1"/>
<text x="163" y="387" class="head">助手前端：会话与工具执行</text>
<text x="163" y="419" class="body">读取目标 / 取得数据快照 / 匹配候选 / 生成预览 / 等待用户确认</text>
<text x="163" y="446" class="body">通过 PASS 桥取得页面能力；导航由宿主执行</text>
<text x="163" y="473" class="body">模型不能通过生成预览直接确认业务写入</text>
<path d="M550 495V552" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#a)"/>
<text x="577" y="529" class="note">用户确认后，通过页面能力写入</text>
<rect x="145" y="552" width="810" height="118" rx="12" fill="#fff7ed" stroke="#cbd5e1"/>
<text x="163" y="584" class="head">业务页面：原有字段、候选、联动与提交</text>
<text x="163" y="616" class="body">IFormPort 提供 describe / read / write / ensureOptions</text>
<text x="163" y="643" class="body">权限、业务校验、试算和保存仍沿用原系统</text>
<text x="35" y="715" class="body">扩展分工：普通场景先组合公开能力；新增工具或协议变化由平台维护者实现。</text>
<text x="35" y="745" class="note">开窗 ≠ 新会话 ≠ 自动发送；本图是职责分层，不表示所有工具都必须按同一顺序调用。</text>
</svg>